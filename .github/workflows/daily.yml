name: Daily update

on:
  schedule:
    - cron: "30 5 * * *"     # 05:30 UTC = 06:30 Madrid in winter, 07:30 in summer
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Yesterday's scraped data: the fallback when a source fails, plus the rating caches.
      - name: Restore data
        uses: actions/cache/restore@v4
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Week number for the IMDb cache
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      # IMDb title lists (~750 MB) refresh weekly; ratings are downloaded every day.
      - name: Cache IMDb title lists
        uses: actions/cache@v4
        with:
          path: |
            cache/imdb/title.basics.tsv.gz
            cache/imdb/title.akas.tsv.gz
          key: imdb-${{ steps.week.outputs.week }}
          restore-keys: imdb-

      - name: Download IMDb data
        run: |
          mkdir -p cache/imdb
          cd cache/imdb
          [ -f title.basics.tsv.gz ] || curl -sfSO https://datasets.imdbws.com/title.basics.tsv.gz
          [ -f title.akas.tsv.gz ]   || curl -sfSO https://datasets.imdbws.com/title.akas.tsv.gz
          curl -sfSO https://datasets.imdbws.com/title.ratings.tsv.gz
          ls -la

      - name: Scrape, build and send alerts
        run: bash code/run_all.sh
        env:
          SITE_URL: https://giraudirene.github.io/vamos-al-cine/
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Show logs
        if: always()
        run: for f in data/*.log; do echo "::group::$f"; tail -n 25 "$f"; echo "::endgroup::"; done

      - name: Save data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: data-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
