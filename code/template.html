<title>Vamos al cine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a ranked marquee list. Sticky filter bar, one row per film (rank, poster, details, ticket-stub rating), sessions grouped by cinema. Side panel for cinemas and discounts. */
:root {
  --bg: #f6f4f1;
  --surface: #ffffff;
  --ink: #1d1a1f;
  --muted: #6b6470;
  --line: #e3dfe2;
  --accent: #b02a37;
  --accent-ink: #ffffff;
  --vo: #8a5a00;
  --vo-bg: #fbefd2;
  --chip: #efecef;
  --past: #b7b1b9;
  --fav: #c98a00;
  --deal: #1f7a4d;
  --map-land: #efece7;
  --map-city: #e6e2dc;
  --map-line: #c9c3cb;
  --map-road: #e0a458;
  --map-water: #7fb0d6;
  --overlay: rgba(20, 16, 22, .35);
  --font-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151217; --surface: #1f1b22; --ink: #f1ecf2; --muted: #a59eaa; --line: #332d37;
    --accent: #f0646a; --accent-ink: #1a0b0d; --vo: #f2c46b; --vo-bg: #3a2f17; --chip: #2b262f; --past: #5d5662;
    --fav: #f2c46b; --deal: #5fd39a; --map-land: #1b181e; --map-city: #241f28; --map-line: #3d3642; --map-road: #a8743a; --map-water: #3d6f96;
    --overlay: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151217; --surface: #1f1b22; --ink: #f1ecf2; --muted: #a59eaa; --line: #332d37;
  --accent: #f0646a; --accent-ink: #1a0b0d; --vo: #f2c46b; --vo-bg: #3a2f17; --chip: #2b262f; --past: #5d5662;
  --fav: #f2c46b; --deal: #5fd39a; --map-land: #1b181e; --map-city: #241f28; --map-line: #3d3642; --map-road: #a8743a; --map-water: #3d6f96;
  --overlay: rgba(0, 0, 0, .55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }      /* panels, filter row: author display rules must not beat the hidden attribute */
html { -webkit-text-size-adjust: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
body.locked { overflow: hidden; }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { padding-block: 28px 8px; }
.brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.brand h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(40px, 8vw, 64px); line-height: .9; margin: 0; letter-spacing: .01em; text-transform: uppercase; }
.brand h1 span { color: var(--accent); }
.brand p { margin: 0; color: var(--muted); max-width: 46ch; text-wrap: balance; }
.stamp { color: var(--muted); font-size: 13px; margin-top: 10px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding-block: 12px; }
.bar .wrap { display: flex; flex-direction: column; gap: 10px; }
.days { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.days::-webkit-scrollbar { display: none; }
.pill { font-size: 14px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; white-space: nowrap; }
.pill small { color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }
.days .pill[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.days .pill[aria-pressed="true"] small { color: inherit; opacity: .7; }
.pill:disabled { opacity: .4; cursor: not-allowed; }
.row2 { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pill.vose[aria-pressed="true"] { background: var(--vo-bg); color: var(--vo); border-color: var(--vo); }
.pill.now[aria-pressed="true"], .pill.few[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pill.favs[aria-pressed="true"] { background: var(--fav); color: var(--bg); border-color: var(--fav); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 12px; font-size: 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.search { flex: 1 1 200px; min-width: 0; font: inherit; font-size: 14px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.tools { margin-left: auto; display: flex; gap: 8px; }
.count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.pill.filt[aria-expanded="true"], .pill.filt.on { border-color: var(--ink); }
.more-filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
.more-filters label { display: grid; gap: 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); min-width: 0; }
.more-filters select { font: inherit; font-size: 14px; text-transform: none; letter-spacing: 0; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; max-width: 46vw; }
.more-filters .pill { align-self: end; }
.badge { display: inline-block; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 2px; font-family: var(--font-body); font-weight: 600; }
.badge.split { color: var(--vo); }
.badge.classic { color: var(--muted); }
.badge.women { color: var(--deal); }
.badge.queer { color: var(--accent); }

.dist { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 4px; white-space: nowrap; }

main { padding-block: 8px 40px; }
.film { display: grid; grid-template-columns: 44px 72px minmax(0, 1fr) auto; gap: 4px 16px; padding-block: 20px; border-bottom: 1px solid var(--line); }
.rank { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.poster { width: 72px; aspect-ratio: 2 / 3; border-radius: 4px; background: var(--chip); object-fit: cover; max-width: 100%; }
.info { min-width: 0; }
.info h2 { font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 1.05; margin: 0 0 4px; text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
.info h2 a { color: inherit; text-decoration: none; }
.info h2 a:hover { color: var(--accent); }
.info h2 .yr { font-weight: 600; color: var(--muted); margin-left: 8px; font-variant-numeric: tabular-nums; }
.meta { color: var(--muted); font-size: 13.5px; }
.meta b { color: var(--ink); font-weight: 500; }
.others { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.others a { color: inherit; }
.stub { align-self: start; text-align: center; min-width: 78px; padding: 8px 10px 6px; border: 1.5px dashed var(--accent); border-radius: 6px; color: var(--accent); text-decoration: none; }
.stub .n { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.stub .n small { font-size: 16px; opacity: .7; }
.stub .v { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
.stub.none { border-color: var(--line); color: var(--muted); }
.stub.few .n { opacity: .55; }
.sessions { grid-column: 3 / 5; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.cine { display: grid; grid-template-columns: minmax(0, 230px) minmax(0, 1fr); gap: 4px 12px; align-items: baseline; }
.cname { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.star { border: 0; background: none; padding: 0 2px; cursor: pointer; color: var(--past); font-size: 15px; line-height: 1; }
.star[aria-pressed="true"] { color: var(--fav); }
.clink { border: 0; background: none; padding: 0; cursor: pointer; font-weight: 600; font-size: 14px; text-align: left; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.clink:hover { color: var(--accent); text-decoration-color: currentColor; }
.price { display: block; font-size: 12px; color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.price s { opacity: .7; }
.price .deal { color: var(--deal); font-weight: 600; }
.times { display: flex; flex-wrap: wrap; gap: 5px; }
.t { font-size: 13.5px; font-variant-numeric: tabular-nums; padding: 2px 8px; border-radius: 4px; background: var(--chip); }
.t.vo { background: var(--vo-bg); color: var(--vo); font-weight: 600; }
a.t { color: inherit; text-decoration: none; border: 1px solid transparent; }
a.t:hover { border-color: currentColor; }
a.t.vo { color: var(--vo); }
.t.vo::after { content: " VO"; font-size: 10px; letter-spacing: .05em; }
.t.past { color: var(--past); background: transparent; text-decoration: line-through; }
.t .d { color: var(--muted); font-size: 11px; margin-right: 4px; }
.more { font-size: 13px; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; justify-self: start; text-align: left; }
.empty { padding: 40px 0; color: var(--muted); text-align: center; }

section.fest { margin-top: 36px; }
.fest h3 { font-family: var(--font-display); font-weight: 800; font-size: 30px; text-transform: uppercase; margin: 0 0 4px; }
.fest > p { color: var(--muted); margin: 0 0 14px; max-width: 65ch; }
.ev { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 2px 14px; padding-block: 12px; border-top: 1px solid var(--line); }
.ev .when { font-variant-numeric: tabular-nums; font-weight: 600; }
.ev .when small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
.ev a { color: var(--ink); font-weight: 600; text-decoration: none; }
.ev a:hover { color: var(--accent); }
.tag { display: inline-block; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); }
.ev .desc { color: var(--muted); font-size: 13.5px; }

footer { color: var(--muted); font-size: 13px; padding-block: 20px 40px; border-top: 1px solid var(--line); }
footer p { max-width: 70ch; margin: 0 0 8px; }
footer a { color: inherit; }

/* side panel */
.scrim { position: fixed; inset: 0; background: var(--overlay); z-index: 20; }
.panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--bg); z-index: 21; border-left: 1px solid var(--line);
  display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.panel-head { display: flex; align-items: flex-start; gap: 10px; padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
.panel-head h3 { font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1; margin: 0; text-transform: uppercase; flex: 1; min-width: 0; text-wrap: balance; }
.panel-head .sub { font-size: 13px; color: var(--muted); margin-top: 4px; font-family: var(--font-body); text-transform: none; font-weight: 400; }
.close { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; width: 34px; height: 34px; cursor: pointer; flex: none; font-size: 18px; line-height: 1; }
.panel-body { overflow-y: auto; padding: 16px 20px 28px; display: flex; flex-direction: column; gap: 18px; }
.panel h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.mapbox { position: relative; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--map-land); }
.mapbox svg { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; }
.mapbox .zoom { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 4px; }
.mapbox .zoom button { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 16px; }
.maplinks { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13.5px; margin-top: 8px; }
.maplinks a { color: var(--accent); }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; }
.kv .deal { color: var(--deal); font-weight: 600; }
.plist { display: flex; flex-direction: column; }
.pfilm { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 2px 12px; padding-block: 10px; border-top: 1px solid var(--line); align-items: start; }
.pfilm img, .pfilm .ph { width: 40px; aspect-ratio: 2 / 3; border-radius: 3px; object-fit: cover; background: var(--chip); }
.pfilm b { font-weight: 600; }
.pfilm .sc { font-family: var(--font-display); font-weight: 800; font-size: 22px; color: var(--accent); font-variant-numeric: tabular-nums; }
.pfilm .times { margin-top: 4px; }
.dir { display: flex; flex-direction: column; }
.dir .row { display: flex; align-items: center; gap: 8px; padding-block: 8px; border-top: 1px solid var(--line); }
.dir .row .clink { flex: 1; min-width: 0; }
.dir .row small { color: var(--muted); font-size: 12px; white-space: nowrap; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 14px; }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.form { display: grid; gap: 10px; }
.form label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.form input, .form select { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; width: 100%; }
.form .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.wd { display: flex; gap: 4px; flex-wrap: wrap; }
.wd label { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; color: var(--ink); background: var(--surface); cursor: pointer; }
.wd input { width: auto; margin: 0; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.quick button { font-size: 13px; border: 1px dashed var(--line); background: none; border-radius: 999px; padding: 4px 10px; cursor: pointer; }
.disc { display: flex; justify-content: space-between; gap: 10px; padding-block: 10px; border-top: 1px solid var(--line); font-size: 14px; }
.disc small { display: block; color: var(--muted); }
.disc button { border: 0; background: none; color: var(--accent); cursor: pointer; font-size: 13px; }
.note { font-size: 13px; color: var(--muted); }
.err { font-size: 13px; color: var(--accent); }

@media (max-width: 640px) {
  .film { grid-template-columns: 64px minmax(0, 1fr) auto; gap: 4px 12px; }
  .rank { display: none; }
  .poster { width: 64px; }
  .info h2 { font-size: 22px; }
  .sessions { grid-column: 1 / 4; }
  .cine { grid-template-columns: minmax(0, 1fr); }
  .stub { min-width: 64px; padding: 6px 8px 4px; }
  .stub .n { font-size: 28px; }
  .tools { margin-left: 0; }
  .panel { top: auto; height: 88%; width: 100%; border-left: 0; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; padding-left: env(safe-area-inset-left, 0px); }
}
@media (prefers-reduced-motion: no-preference) {
  .film { animation: rise .25s ease-out both; }
  .panel { animation: slide .2s ease-out both; }
  @keyframes rise { from { transform: translateY(4px); } to { transform: none; } }
  @keyframes slide { from { transform: translateX(16px); } to { transform: none; } }
}

.hdr-right { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.btn.acct { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; padding: 8px 18px; }
.lang { display: inline-flex; gap: 2px; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.lang button { border: 0; background: none; padding: 4px 10px; font-size: 12px; letter-spacing: .06em; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.pill.tog[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tracked { margin-top: 14px; padding: 10px 14px; border: 1px solid var(--fav); border-radius: 8px; font-size: 14px; background: var(--surface); }
.tlink { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.follow { margin-top: 6px; font-size: 12.5px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 10px; cursor: pointer; }
.follow[aria-pressed="true"] { border-color: var(--fav); color: var(--fav); font-weight: 600; }
.film.is-tracked .poster { outline: 2px solid var(--fav); outline-offset: 2px; }
.badge.new { color: var(--deal); }
.badge.last { color: var(--accent); }
.badge.wl { color: var(--fav); }
.muted { color: var(--muted); }
.calrow { border-top: 1px solid var(--line); padding-block: 10px; }
.calrow summary { cursor: pointer; display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 2px 14px; list-style: none; }
.calrow summary::-webkit-details-marker { display: none; }
.calrow .cdates { font-weight: 600; font-variant-numeric: tabular-nums; }
.calrow .cname2 { font-weight: 600; }
.calrow .meta { grid-column: 2; }
.calrow ul { margin: 8px 0 0 154px; padding: 0; list-style: none; font-size: 14px; display: grid; gap: 4px; }
.calrow .when2 { font-variant-numeric: tabular-nums; color: var(--muted); }
.calrow a { color: var(--ink); }
.addt { grid-template-columns: minmax(0, 1fr) auto; align-items: end; margin-top: 10px; }
.filebtn { display: inline-block; cursor: pointer; }
.cinehits { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.ftitle { border: 0; background: none; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; text-align: left; cursor: pointer; }
.ftitle:hover { color: var(--accent); }
.poster[data-film] { cursor: pointer; }
.tlink.small { font-size: 12.5px; font-weight: 600; }

.fhead { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; align-items: start; }
.fhead img { width: 96px; border-radius: 4px; }
.fhead p { margin: 0 0 8px; }
.starpick { display: flex; gap: 2px; }
.starpick button { border: 0; background: none; font-size: 26px; line-height: 1; cursor: pointer; color: var(--past); padding: 0 2px; }
.starpick button[aria-pressed="true"] { color: var(--fav); }
.form textarea { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; resize: vertical; }
.rev { border-top: 1px solid var(--line); padding-block: 10px; font-size: 14px; }
.rev p { margin: 4px 0 0; white-space: pre-line; }
.reply { margin: 8px 0 0 18px; padding-left: 12px; border-left: 2px solid var(--line); }
.ractions { display: flex; gap: 14px; margin-top: 4px; }
.more.danger { color: var(--muted); }
.more.danger:hover { color: var(--accent); }
.replyform { margin: 8px 0 0 18px; }
.rstars { color: var(--fav); letter-spacing: 1px; }
.okmsg { font-size: 13px; color: var(--deal); }
.intro { font-size: 14px; margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--vo-bg); color: var(--ink); }
.check { display: flex !important; grid-template-columns: none; align-items: center; gap: 8px; color: var(--ink) !important; font-size: 14px !important; }
.check input { width: auto !important; }
.tabs { margin-bottom: 4px; }
.sessions-panel { display: flex; flex-direction: column; gap: 8px; }
@media (max-width: 640px) {
  .calrow summary { grid-template-columns: minmax(0, 1fr); }
  .calrow .meta { grid-column: 1; }
  .calrow ul { margin-left: 0; }
  .hdr-right { margin-left: 0; width: 100%; flex-direction: row; justify-content: space-between; align-items: center; }
}
</style>

<header class="top wrap">
  <div class="brand">
    <h1>Vamos al cine<span>.</span></h1>
    <p data-i18n="tagline"></p>

  const isFav = c => state.favs.has(D.cinemas[c].n);
  function toggleFav(c) { const n = D.cinemas[c].n, adding = !state.favs.has(n); adding ? state.favs.add(n) : state.favs.delete(n); if (!state.favs.size) state.favOnly = false; save(); render(); refreshPanel(); if (adding) askLogin(); }

    (spreadOf(f) >= 1.5 ? `<span class="badge split" title="${esc(T("splitT")(num(spreadOf(f), 1)))}">${T("split")}</span>` : "");

  // ---------- main list ----------
  function render() {
    daysEl.innerHTML = dates.concat(["all"]).map(d => `<button type="button" class="pill" data-d="${d}" aria-pressed="${state.day === d}">${dayLabel(d)}</button>`).join("");
    $("now").setAttribute("aria-pressed", state.now); $("vose").setAttribute("aria-pressed", state.vose); $("few").setAttribute("aria-pressed", state.few);
    $("favs").setAttribute("aria-pressed", state.favOnly);
    $("favs").textContent = T("myCinemas") + (state.favs.size ? " (" + state.favs.size + ")" : "");
    $("openDisc").textContent = T("myDisc") + (state.discounts.length ? " (" + state.discounts.length + ")" : "");
    $("openTrack").textContent = T("myFilms") + (state.track.length ? " (" + state.track.length + ")" : "");
    const nf = activeFilters();
    $("filt").textContent = T("filters") + (nf ? " (" + nf + ")" : ""); $("filt").classList.toggle("on", nf > 0);
    TOGGLES.forEach(([id, k]) => $(id).setAttribute("aria-pressed", state[k]));
    $("fWatch").hidden = !state.wl.length; $("fTracked").hidden = !state.track.length; $("fNew").hidden = !D.films.some(isNew);
    [...$("src").children].forEach(b => b.setAttribute("aria-pressed", b.dataset.s === state.src));
    const q = state.q;
    const byFilm = new Map();
    for (const s of filteredShows(s => {
      if (state.favOnly && !isFav(s[1])) return false;
      if (state.now) { const m = toMin(s[3]); if (s[2] !== todayIso || m < nowMin - 5 || m > nowMin + 180) return false; }
      if (state.from && toMin(s[3]) < toMin(state.from)) return false;
      if (state.until && toMin(s[3]) + (D.films[s[0]].rt || 110) > toMin(state.until)) return false;   // runtime unknown: assume 110 min
      if (state.near) { const d = distTo(s[1]); if (d == null || d > state.radius) return false; }
      const f = D.films[s[0]];
      if (!filmOk(f)) return false;
      if (q && !(f.keys.some(k => hits(k, q)) || hits(f.d, q) || hits(D.cinemas[s[1]].n, q))) return false;
      return true;
    })) {
      if (!byFilm.has(s[0])) byFilm.set(s[0], []);
      byFilm.get(s[0]).push(s);
    }
    let films = [...byFilm.keys()].map(i => D.films[i]);
    if (state.few && !q) films = films.filter(f => SRC[state.src].get(f).v >= MIN_VOTES || isTracked(f) || inWatchlist(f));
    films.sort(sortFilms);
    $("count").textContent = T("films")(films.length);

    // films you follow / watchlist that are on (any day)
    const onNow = D.films.filter(f => lastDate[f.idx] && (isTracked(f) || inWatchlist(f)));
    $("tracked").hidden = !onNow.length;
    if (onNow.length) {
      $("tracked").innerHTML = `<b>${T("trackedNow")}</b> ` + onNow.map(f => {
        const n = new Set(D.shows.filter(s => s[0] === f.idx).map(s => s[1])).size;
        return `<button class="tlink" type="button" data-find="${esc(f.t)}">${esc(f.t)}</button> <span class="meta">(${T("inCinemas")(n)})</span>`;
      }).join(" · ");
    }

    const multi = state.day === "all";
    const rawQ = $("q").value.trim();
    const cineHits = q ? D.cinemas.map((c, i) => [c, i]).filter(([c]) => hits(c.n, q)) : [];
    const offerTrack = rawQ.length >= 3 && !cineHits.length && !D.films.some(f => f.keys.some(k => hits(k, q))) && !state.track.some(t => norm(t) === q);
    $("list").innerHTML = (cineHits.length ? `<div class="cinehits">${cineHits.slice(0, 6).map(([c, i]) => `<button class="pill" type="button" data-cine="${i}">${esc(c.n)} →</button>`).join("")}</div>` : "") +
      (!films.length ? `<div class="empty">${esc(T("none"))}</div>` : "") +
      (offerTrack ? `<div class="empty"><button class="btn" type="button" id="trackQuery">${esc(T("trackQuery")(rawQ))}</button></div>` : "") +
      films.map((f, k) => {
        const ss = byFilm.get(f.idx);
        const byC = new Map();
        ss.forEach(s => { if (!byC.has(s[1])) byC.set(s[1], []); byC.get(s[1]).push(s); });
        let cines = [...byC.entries()].sort((a, b) => {
          if (state.near) return (distTo(a[0]) ?? 99) - (distTo(b[0]) ?? 99);
          const live = x => x[1].some(s => !isPast(s));
          return (isFav(b[0]) - isFav(a[0])) || (live(b) - live(a)) || D.cinemas[a[0]].n.localeCompare(D.cinemas[b[0]].n, "es");
        });
        const open = state.open.has(f.idx), LIMIT = 5, hidden = cines.length - LIMIT;
        if (!open && hidden > 0) cines = cines.slice(0, LIMIT);
        const rows = cines.map(([cid, list]) => {
          list.sort((a, b) => (a[2] + a[3]).localeCompare(b[2] + b[3]));
          const dist = state.near && distTo(cid) != null ? `<span class="dist">${num(distTo(cid), 1)} km</span>` : "";
          return `<div class="cine"><div><div class="cname"><button class="star" type="button" data-fav="${cid}" aria-pressed="${isFav(cid)}" aria-label="${esc(T("fav"))}">★</button><button class="clink" type="button" data-cine="${cid}">${esc(D.cinemas[cid].n)}</button>${dist}</div>${priceHtml(cid, list)}</div><div class="times">${chipsHtml(list, multi)}</div></div>`;
        }).join("");
        const more = !open && hidden > 0 ? `<button class="more" type="button" data-open="${f.idx}">${T("moreCinemas")(hidden)}</button>` : "";
        const meta = [f.c, f.rt ? f.rt + " min" : "", f.age, (f.g || []).slice(0, 3).map(g => GENRES[lang][g] || g).join(", ")].filter(Boolean).map(esc).join(" · ");
        const people = (f.d ? `${T("by")} <b>${esc(f.d)}</b>` : "") + (f.cast && f.cast.length ? (f.d ? ", " + T("with") + " " : "") + esc(f.cast.join(", ")) : "");
        const others = Object.entries(SRC).filter(([k]) => k !== state.src && k !== "av").map(([k, S]) => {
          const R = S.get(f); if (R.r == null) return "";
          const v = R.max === 5 ? num(R.r, 2) + "/5" : num(R.r, 1);
          return R.url ? `<a href="${esc(R.url)}" target="_blank" rel="noopener">${S.name} ${v}</a>` : `${S.name} ${v}`;
        }).filter(Boolean).join(" · ");
        const club = clubOf(f);
        const clubTxt = club.n || club.comments ? `<button class="tlink small" type="button" data-film="${f.idx}">${club.n ? T("club") + " ★ " + num(club.avg, 1) + " (" + club.n + ")" : ""}${club.n && club.comments ? " · " : ""}${club.comments ? T("nComments")(club.comments) : ""}</button>` : "";
        const img = f.img ? `<img class="poster" src="${f.img}" alt="" loading="lazy" data-film="${f.idx}">` : `<div class="poster" data-film="${f.idx}"></div>`;
        const tr = isTracked(f);
        return `<article class="film${tr ? " is-tracked" : ""}">
          <div class="rank">${k + 1}</div>${img}
          <div class="info"><h2><button class="ftitle" type="button" data-film="${f.idx}">${esc(f.t)}</button>${f.y ? `<span class="yr">${f.y}</span>` : ""}${badges(f)}</h2>
            <div class="meta">${meta}</div><div class="meta">${people}</div>${others || clubTxt ? `<div class="others">${[others, clubTxt].filter(Boolean).join(" · ")}</div>` : ""}
            <button class="follow" type="button" data-track="${f.idx}" aria-pressed="${tr}">${tr ? "✓ " + T("following") : "+ " + T("follow")}</button></div>
          ${stubHtml(f)}
          <div class="sessions">${rows}${more}</div>
        </article>`;
      }).join("");
    const tq = $("trackQuery"); if (tq) tq.addEventListener("click", () => { state.track.push(rawQ); save(); $("q").value = ""; state.q = ""; render(); if (!askLogin()) openTracking(); });

    // today's festival sessions
    const ev = D.events.filter(e => e.date >= todayIso && (state.day === "all" || e.date === state.day) && hits(e.t + " " + e.cyc + " " + e.sec + " " + e.w, q));
    $("fest").innerHTML = `<h3>${T("fest")}</h3><p>${T("festIntro")}</p>` +
      (ev.length ? ev.map(e => {
        const dt = parse(e.date);
        return `<div class="ev"><div class="when">${e.times.join(" · ")}<small>${WDL()[dt.getDay()]} ${dt.getDate()}</small></div>
          <div><span class="tag">${esc(e.cyc || e.sec)}</span> <span class="meta">· ${esc(e.w)}</span><br><a href="${esc(e.u)}" target="_blank" rel="noopener">${esc(e.t)}</a>${e.rt ? ` <span class="meta">· ${e.rt} min</span>` : ""}
          <div class="desc">${esc(e.desc)}</div></div></div>`;
      }).join("") : `<div class="ev"><div></div><div class="desc">${T("festNone")}</div></div>`);

    // festival calendar: next 60 days, grouped by festival
    const groups = new Map();
    (D.fest || []).filter(e => e.date >= todayIso).forEach(e => {
      const canon = FEST_NAMES.find(([re]) => re.test(e.cyc));
      const name = canon ? canon[1] : e.cyc.replace(/\s+/g, " ").trim(), key = canon ? canon[1] : norm(name).replace(/^\d+ /, "").slice(0, 40);
      if (!groups.has(key)) groups.set(key, { name, canon: !!canon, venues: new Set(), list: [] });
      const g = groups.get(key); g.venues.add(e.w); g.list.push(e);
    });
    const fmt = d => { const x = parse(d); return x.getDate() + " " + x.toLocaleDateString(lang, { month: "short" }); };
    const cal = [...groups.values()].sort((a, b) => a.list[0].date.localeCompare(b.list[0].date));
    $("cal").innerHTML = `<h3>${T("cal")}</h3><p>${T("calIntro")}</p>` + (cal.length ? cal.map(g => {
      const first = g.list[0].date, last = g.list[g.list.length - 1].date;
      return `<details class="calrow"><summary><span class="cdates">${fmt(first)}${last !== first ? " – " + fmt(last) : ""}</span>
        <span class="cname2">${esc(g.canon ? g.name : g.name.replace(/(^|\s)(\p{L})/gu, (m, a, b) => a + b.toUpperCase()))}</span><span class="meta">${esc([...g.venues].join(", "))} · ${T("sessions")(g.list.length)}</span></summary>
        <ul>${g.list.map(e => `<li><span class="when2">${WD()[parse(e.date).getDay()]} ${parse(e.date).getDate()} · ${e.time}</span> <a href="${esc(e.u)}" target="_blank" rel="noopener">${esc(e.t)}</a> <span class="meta">· ${esc(e.w)}</span></li>`).join("")}</ul></details>`;
    }).join("") : `<p class="note">${T("calNone")}</p>`);
  }

  document.addEventListener("click", e => {
    const o = e.target.closest("[data-open]"); if (o) { state.open.add(+o.dataset.open); render(); return; }
    const f = e.target.closest("[data-fav]"); if (f) { toggleFav(+f.dataset.fav); return; }
    const c = e.target.closest("[data-cine]"); if (c) { openCinema(+c.dataset.cine); return; }
    const t = e.target.closest("[data-track]"); if (t) { toggleTrack(D.films[+t.dataset.track]); return; }
    const fm = e.target.closest("[data-film]"); if (fm) { openFilm(+fm.dataset.film); return; }
    const fd = e.target.closest("[data-find]"); if (fd) { $("q").value = fd.dataset.find; state.q = norm(fd.dataset.find); state.day = "all"; render(); window.scrollTo({ top: 0 }); return; }
  });

  // ---------- panel ----------
  let panelView = null, lastFocus = null;
  function showPanel(view) {
    panelView = view;
    if ($("panel").hidden) lastFocus = document.activeElement;
    $("panel").hidden = false; $("scrim").hidden = false; document.body.classList.add("locked");
    view.redraw();
    $("close").focus({ preventScroll: true });
  }
  function closePanel() {
    $("panel").hidden = true; $("scrim").hidden = true; document.body.classList.remove("locked"); panelView = null;
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }
  $("close").addEventListener("click", closePanel);
  $("scrim").addEventListener("click", closePanel);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("panel").hidden) closePanel(); });
  function refreshPanel() { if (!panelView) return; const st = $("panelBody").scrollTop; panelView.redraw(); $("panelBody").scrollTop = st; }

  const mapBase = { munis: M.munis.map(m => `<path d="${m.d}" />`).join(""), dist: M.districts.map(m => `<path d="${m.d}" />`).join("") };
  function mapSvg(c, span) {
    const C = D.cinemas[c];
    const [cx, cy] = proj(C.lat, C.lon), w = span, h = span * 3 / 4, k = span / 12;
    const labels = [...M.districts.map(m => [m, 1]), ...M.munis.map(m => [m, 0])]
      .filter(([m]) => Math.abs(m.x - cx) < w / 2 && Math.abs(m.y - cy) < h / 2)
      .map(([m, isD]) => `<text x="${m.x}" y="${m.y}" font-size="${(isD ? .34 : .4) * k}" text-anchor="middle" fill="var(--muted)" opacity="${isD ? .9 : .7}">${esc(m.n)}</text>`).join("");
    const dots = D.cinemas.map((o, i) => {
      if (i === c || o.lat == null) return "";
      const [x, y] = proj(o.lat, o.lon);
      if (Math.abs(x - cx) > w / 2 || Math.abs(y - cy) > h / 2) return "";
      return `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="${.11 * k}" fill="${isFav(i) ? "var(--fav)" : "var(--muted)"}" opacity=".8"><title>${esc(o.n)}</title></circle>`;
    }).join("");
    return `<svg viewBox="${cx - w / 2} ${cy - h / 2} ${w} ${h}" role="img" aria-label="${esc(T("map") + ": " + C.n)}">
      <rect x="${cx - w / 2}" y="${cy - h / 2}" width="${w}" height="${h}" fill="var(--map-land)" />
      <g fill="none" stroke="var(--map-line)" stroke-width="${.03 * k}" stroke-linejoin="round">${mapBase.munis}</g>
      <g fill="none" stroke="var(--map-line)" stroke-width="${.02 * k}" stroke-dasharray="${.08 * k} ${.06 * k}">${mapBase.dist}</g>
      <path d="${M.river}" fill="none" stroke="var(--map-water)" stroke-width="${.07 * k}" stroke-linecap="round" />
      <path d="${M.m30}" fill="none" stroke="var(--map-road)" stroke-width="${.09 * k}" stroke-linecap="round" opacity=".85" />
      ${labels}${dots}
      <circle cx="${cx}" cy="${cy}" r="${.5 * k}" fill="var(--accent)" opacity=".18" />
      <circle cx="${cx}" cy="${cy}" r="${.2 * k}" fill="var(--accent)" stroke="var(--bg)" stroke-width="${.06 * k}" />
    </svg>`;
  }

  let mapSpan = 8;
  function openCinema(c) {
    showPanel({ redraw: () => {
      const C = D.cinemas[c];
      const all = filteredShows(s => s[1] === c);
      const byF = new Map();
      all.forEach(s => { if (!byF.has(s[0])) byF.set(s[0], []); byF.get(s[0]).push(s); });
      const films = [...byF.keys()].map(i => D.films[i]).sort(sortFilms);
      const multi = state.day === "all";
      const dayTxt = state.day === "all" ? T("thisWeek") : dayLabel(state.day).replace(/<small>/, " ").replace(/<[^>]+>/g, "").toLowerCase();
      const pr = priceFor(c, state.day === "all" ? todayIso : state.day, null);
      const gmaps = C.lat != null ? `https://www.google.com/maps/search/?api=1&query=${C.lat},${C.lon}` : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(C.n + " " + (C.a || "") + " Madrid")}`;
      const rows = [];
      const R = C.pr;
      if (R && (R.n != null || R.w != null)) {
        if (R.n != null) rows.push(`<dt>${T("normalP")}</dt><dd>${R.from ? T("from_") + " " : ""}${eur(R.n)}</dd>`);
        if (R.w != null) rows.push(`<dt>${R.wf ? T("fridayToo") : T("weekendP")}</dt><dd>${eur(R.w)}</dd>`);
        Object.entries(R.d || {}).forEach(([k, v]) => rows.push(`<dt>${T("esp")} · ${WDL()[(+k + 1) % 7].toLowerCase()}</dt><dd class="deal">${eur(v[0])}</dd>`));
      } else rows.push(`<dt>${T("ticket")}</dt><dd>${T("noPrice")}</dd>`);
      if (C.pt) rows.push(`<dt>${T("detail")}</dt><dd>${esc(C.pt)}</dd>`);
      if (R && R.src) rows.push(`<dt>${T("source")}</dt><dd>${/^https?:/.test(R.src) ? `<a href="${esc(R.src)}" target="_blank" rel="noopener">${T("theSite")}</a>` : esc(R.src)}${R.chk ? ", " + T("checked")(new Date(R.chk).toLocaleDateString(lang)) : ""}</dd>`);
      if (pr.best) rows.push(`<dt>${T("yourPrice")}</dt><dd class="deal">${eur(pr.best.p)} ${T("withDisc")} ${esc(pr.best.name)}</dd>`);
      const applicable = state.discounts.filter(d => scopeMatches(d, c));
      $("panelTitle").innerHTML = `${esc(C.n)}<div class="sub">${esc([C.a, C.town].filter(Boolean).join(" · "))}${C.ch ? " · " + esc(C.ch) : ""}</div>`;
      $("panelBody").innerHTML = `
        <div><button class="pill favs" type="button" data-fav="${c}" aria-pressed="${isFav(c)}">${isFav(c) ? T("inMine") : T("addMine")}</button></div>
        <div>
          ${C.lat != null ? `<div class="mapbox">${mapSvg(c, mapSpan)}<div class="zoom"><button type="button" data-z="-1" aria-label="${esc(T("zoomIn"))}">+</button><button type="button" data-z="1" aria-label="${esc(T("zoomOut"))}">−</button></div></div>` : `<p class="note">${T("noLoc")}</p>`}
          <div class="maplinks"><a href="${gmaps}" target="_blank" rel="noopener">${T("gmaps")}</a><a href="${esc(C.u)}" target="_blank" rel="noopener">${T("listing")} ${esc(C.src === "web del cine" ? T("theSite") : C.src)}</a></div>
        </div>
        <div><h4>${T("price")}</h4><dl class="kv">${rows.join("")}</dl>
          ${R && /cadena/.test(R.src || "") ? `<p class="note">${T("chainApprox")}</p>` : ""}
          ${!applicable.length ? `<p class="note">${T("discHint")} <button class="more" type="button" id="toDisc">${T("addDisc")}</button></p>` : ""}</div>
        <div><h4>${esc(T("showing")(dayTxt))}${state.vose ? T("onlyVose") : ""}</h4>
          <div class="plist">${films.length ? films.map(f => {
            const ss = byF.get(f.idx).sort((a, b) => (a[2] + a[3]).localeCompare(b[2] + b[3]));
            return `<div class="pfilm">${f.img ? `<img src="${f.img}" alt="">` : `<div class="ph"></div>`}
              <div><b>${esc(f.t)}</b> <span class="meta">${esc([f.y, f.rt ? f.rt + " min" : ""].filter(Boolean).join(" · "))}</span><div class="times">${chipsHtml(ss, multi)}</div></div>
              ${stubHtml(f, true)}</div>`;
          }).join("") : `<p class="note">${esc(T("noSess")(dayTxt))}</p>`}</div></div>`;
      $("panelBody").querySelectorAll("[data-z]").forEach(b => b.addEventListener("click", () => { mapSpan = Math.min(48, Math.max(2, mapSpan * (b.dataset.z === "1" ? 2 : .5))); refreshPanel(); }));
      const td = $("toDisc"); if (td) td.addEventListener("click", () => openDiscounts(c));
    } });
  }

  function openDirectory() {
    showPanel({ redraw: () => {
      const counts = {};
      filteredShows().forEach(s => { counts[s[1]] = (counts[s[1]] || 0) + 1; });
      const idx = D.cinemas.map((_, i) => i), city = i => /^madrid$/i.test(D.cinemas[i].town || "Madrid");
      const groups = [[T("yours"), idx.filter(isFav)], [T("capital"), idx.filter(i => !isFav(i) && city(i))], [T("region"), idx.filter(i => !isFav(i) && !city(i))]];
      $("panelTitle").innerHTML = `${T("dirTitle")}<div class="sub">${T("dirSub")}</div>`;
      $("panelBody").innerHTML = groups.filter(g => g[1].length).map(([name, list]) => `<div><h4>${name}</h4><div class="dir">${list.sort((a, b) => D.cinemas[a].n.localeCompare(D.cinemas[b].n, "es")).map(i => {
        const C = D.cinemas[i];
        return `<div class="row"><button class="star" type="button" data-fav="${i}" aria-pressed="${isFav(i)}" aria-label="${esc(T("fav"))}">★</button><button class="clink" type="button" data-cine="${i}">${esc(C.n)}</button><small>${C.town && !/^madrid$/i.test(C.town) ? esc(C.town) + " · " : ""}${T("nSess")(counts[i] || 0)}</small></div>`;
      }).join("")}</div></div>`).join("");
    } });

  // ---------- discounts ----------
  const DAYS_ORDER = [1, 2, 3, 4, 5, 6, 0];
  function discDesc(d) {
    const scope = d.scope === "all" ? T("allCinemas") : d.scope.startsWith("chain:") ? T("cinemasOf")(d.scope.slice(6)) : d.scope.slice(7);
    const val = d.kind === "price" ? eur(d.value) : d.kind === "pct" ? "−" + d.value + " %" : "−" + eur(d.value);
    const days = d.days && d.days.length && d.days.length < 7 ? " · " + DAYS_ORDER.filter(x => d.days.includes(x)).map(x => WD()[x]).join(", ") : "";
    return `${val} · ${esc(scope)}${days}`;
  }
  function openDiscounts(preCinema) {
    const chains = [...new Set(D.cinemas.map(c => c.ch).filter(Boolean))].sort((a, b) => a.localeCompare(b, "es"));
    showPanel({ redraw: function draw() {
      $("panelTitle").innerHTML = `${T("discTitle")}<div class="sub">${T("discSub")}</div>`;
      $("panelBody").innerHTML = `
        <div>${state.discounts.length ? state.discounts.map((d, i) => `<div class="disc"><div><b>${esc(d.name)}</b><small>${discDesc(d)}</small></div><button type="button" data-del="${i}">${T("remove")}</button></div>`).join("") : `<p class="note">${T("discNone")}</p>`}</div>
        <form class="form" id="discForm" novalidate>
          <h4>${T("newDisc")}</h4>
          <div class="quick">${T("quick").map(n => `<button type="button" data-q="${esc(n)}">${esc(n)}</button>`).join("")}</div>
          <label>${T("name")}<input id="dName" required placeholder="${esc(T("namePh"))}"></label>
          <label>${T("where")}<select id="dScope">

  function parseCsv(text) {
    const rows = []; let row = [], cell = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) { if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (ch === '"') q = false; else cell += ch; }
      else if (ch === '"') q = true; else if (ch === ",") { row.push(cell); cell = ""; }
      else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
      else cell += ch;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }
  const readText = file => new Promise((ok, fail) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = fail; r.readAsText(file); });
  async function readWatchlist(file) {
    let text = null;
    if (/\.zip$/i.test(file.name)) {
      if (!window.JSZip) throw new Error("zip");
      const zip = await JSZip.loadAsync(file);
      const entry = Object.values(zip.files).find(z => /(^|\/)watchlist\.csv$/i.test(z.name));
      if (entry) text = await entry.async("string");
    } else text = await readText(file);
    if (!text) throw new Error("csv");
    const rows = parseCsv(text.replace(/^﻿/, ""));
    const head = (rows.shift() || []).map(h => h.trim().toLowerCase());
    const iN = head.indexOf("name"), iY = head.indexOf("year");
    if (iN < 0) throw new Error("csv");
    return rows.filter(r => r[iN]).map(r => ({ n: r[iN], y: +r[iY] || null }));
  }

        $("resetForm").addEventListener("submit", async e => {
          e.preventDefault();
          const { error } = await sb.auth.resetPasswordForEmail($("aEmail").value.trim(), { redirectTo: location.origin + location.pathname });
          if (error) { err = authError(error); msg = ""; } else { msg = T("resetSent"); err = ""; }
          draw();
        });
      } else {
        const up = view === "signup";
        $("panelBody").innerHTML = `${tabs}${note}<form class="form" id="authForm" novalidate>
          ${up ? `<label>${T("dname")}<input id="aName" maxlength="40" autocomplete="nickname"></label>` : ""}
          <label>${T("email")}<input id="aEmail" type="email" autocomplete="email"></label>
          <label>${T("password")}<input id="aPw" type="password" autocomplete="${up ? "new-password" : "current-password"}" ${up ? `placeholder="${esc(T("pwHint"))}"` : ""}></label>
          <div><button class="btn" type="submit">${up ? T("signup") : T("login")}</button></div>
          ${up ? "" : `<button class="more" type="button" data-v="reset">${T("forgot")}</button>`}</form>`;
        $("authForm").addEventListener("submit", async e => {
          e.preventDefault();
          const email = $("aEmail").value.trim(), pw = $("aPw").value;
          if (up) {
            const name = $("aName").value.trim();
            if (!name) { err = T("errName"); return draw(); }
            if (pw.length < 8) { err = T("errShort"); return draw(); }
            const { data, error } = await sb.auth.signUp({ email, password: pw, options: { data: { display_name: name }, emailRedirectTo: location.origin + location.pathname } });
            if (error) { err = authError(error); msg = ""; }
            else if (data && data.user && data.user.identities && !data.user.identities.length) { err = T("errExists"); msg = ""; }
            else { msg = data && data.session ? "" : T("checkMail"); err = ""; }
          } else {
            const { error } = await sb.auth.signInWithPassword({ email, password: pw });
            if (error) { err = authError(error); msg = ""; } else { err = ""; msg = ""; }
          }
          draw();
        });
      }
      $("panelBody").querySelectorAll("[data-v]").forEach(b => b.addEventListener("click", () => { view = b.dataset.v; msg = ""; err = ""; draw(); }));
    } });
  }

  // ---------- film page: details, sessions, club stars and comments ----------
  const starsTxt = n => "★★★★★".slice(0, n) + "☆☆☆☆☆".slice(0, 5 - n);
  function openFilm(i) {
    let draftStars = null, draftText = null, msg = "", err = "", replyOpen = null, confirmKey = null;
    showPanel({ redraw: function draw() {
      const f = D.films[i], key = filmKey(f), rs = reviews.get(key) || [], mine = user ? rs.find(r => r.user_id === user.id) : null, club = clubOf(f);
      if (draftStars === null) draftStars = mine ? mine.stars || 0 : 0;
      if (draftText === null) draftText = mine ? mine.comment || "" : "";
      const meta = [f.y, f.c, f.rt ? f.rt + " min" : "", f.age, (f.g || []).slice(0, 3).map(g => GENRES[lang][g] || g).join(", ")].filter(Boolean).map(esc).join(" · ");
      const scores = Object.entries(SRC).filter(([k]) => k !== "av").map(([k, S]) => {
        const R = S.get(f); if (R.r == null) return "";
        const v = R.max === 5 ? num(R.r, 2) + "/5" : num(R.r, 1);
        return `<dt>${S.name}</dt><dd>${R.url ? `<a href="${esc(R.url)}" target="_blank" rel="noopener">${v}</a>` : v} <span class="meta">· ${R.v.toLocaleString(lang)} ${T("votes")}</span></dd>`;
      }).join("");
      const ss = filteredShows(s => s[0] === i);
      const byC = new Map(); ss.forEach(s => { if (!byC.has(s[1])) byC.set(s[1], []); byC.get(s[1]).push(s); });
      const sess = [...byC.entries()].sort((a, b) => (isFav(b[0]) - isFav(a[0])) || D.cinemas[a[0]].n.localeCompare(D.cinemas[b[0]].n, "es")).map(([cid, list]) =>
        `<div class="cine"><div class="cname"><button class="clink" type="button" data-cine="${cid}">${esc(D.cinemas[cid].n)}</button></div><div class="times">${chipsHtml(list.sort((a, b) => (a[2] + a[3]).localeCompare(b[2] + b[3])), state.day === "all")}</div></div>`).join("");
      const isAdmin = !!(profile && profile.is_admin), blocked = !!(profile && profile.blocked);
      const nameOf = x => x.profiles ? x.profiles.display_name : "";
      const actions = (type, item) => {
        const own = user && item.user_id === user.id, out = [];
        if (type === "rev" && user && !blocked) out.push(`<button class="more" type="button" data-reply="${item.id}">${T("reply")}</button>`);
        if (own || isAdmin) out.push(`<button class="more danger" type="button" data-del="${type}:${item.id}">${confirmKey === "del-" + type + "-" + item.id ? T("sure") : T("deleteReview")}</button>`);
        if (isAdmin && !own) out.push(`<button class="more danger" type="button" data-block="${item.user_id}">${confirmKey === "blk-" + item.user_id ? T("sure") : T("block")(nameOf(item))}</button>`);
        return out.length ? `<div class="ractions">${out.join("")}</div>` : "";
      };
      const form = !sb ? "" : user && blocked ? `<p class="note">${T("blockedNote")}</p>` : user ? `<form class="form review" id="revForm" novalidate>
          <div class="starpick" role="group" aria-label="${esc(T("yourReview"))}">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-star="${n}" aria-pressed="${n <= draftStars}" aria-label="${n}">★</button>`).join("")}</div>
          <textarea id="revText" rows="3" maxlength="2000" placeholder="${esc(T("commentPh"))}">${esc(draftText)}</textarea>
          <div class="row2"><button class="btn" type="submit">${T("saveReview")}</button>${mine ? `<button class="btn ghost" type="button" id="revDel">${T("deleteReview")}</button>` : ""}</div>
          ${msg ? `<p class="okmsg">${esc(msg)}</p>` : ""}${err ? `<p class="err">${esc(err)}</p>` : ""}</form>`
        : `<p class="note">${T("loginToReview")} <button class="more" type="button" id="toLogin">${T("signIn")}</button></p>`;
      const list = rs.filter(r => r.comment && r.comment.trim() || r.stars).map(r => `<div class="rev">
          <div><b>${esc(nameOf(r))}</b> ${r.stars ? `<span class="rstars" aria-label="${r.stars}/5">${starsTxt(r.stars)}</span>` : ""} <span class="meta">${new Date(r.updated_at).toLocaleDateString(lang)}</span></div>
          ${r.comment ? `<p>${esc(r.comment)}</p>` : ""}${actions("rev", r)}
          ${(replies.get(r.id) || []).map(x => `<div class="reply"><div><b>${esc(nameOf(x))}</b> <span class="meta">${new Date(x.created_at).toLocaleDateString(lang)}</span></div><p>${esc(x.body)}</p>${actions("rep", x)}</div>`).join("")}
          ${replyOpen === r.id ? `<form class="form replyform" data-review="${r.id}" novalidate><textarea id="replyText" rows="2" maxlength="1000" placeholder="${esc(T("replyPh")(nameOf(r)))}"></textarea>
            <div class="row2"><button class="btn" type="submit">${T("send")}</button><button class="more" type="button" data-reply="0">${T("cancel")}</button></div></form>` : ""}
        </div>`).join("");
      const tr = isTracked(f);
      $("panelTitle").innerHTML = `${esc(f.t)}<div class="sub">${meta}</div>`;
      $("panelBody").innerHTML = `
        <div class="fhead">${f.img ? `<img src="${f.img}" alt="">` : ""}<div>
          ${f.d ? `<p class="meta">${T("by")} <b>${esc(f.d)}</b>${f.cast && f.cast.length ? ", " + T("with") + " " + esc(f.cast.join(", ")) : ""}</p>` : ""}
          <p>${badges(f)}</p>
          <button class="follow" type="button" data-track="${i}" aria-pressed="${tr}">${tr ? "✓ " + T("following") : "+ " + T("follow")}</button></div></div>
        <div><h4>${T("scores")}</h4><dl class="kv">${scores}${sb ? `<dt>${T("clubScore")}</dt><dd>${club.n ? `<span class="rstars">${starsTxt(Math.round(club.avg))}</span> ${num(club.avg, 1)} <span class="meta">· ${club.n}</span>` : `<span class="meta">${T("noClub")}</span>`}</dd>` : ""}</dl></div>
        ${sb ? `<div><h4>${T("yourReview")}</h4>${form}</div>` : ""}
        ${sb ? `<div><h4>${T("comments")}</h4>${list || `<p class="note">${T("noComments")}</p>`}</div>` : ""}
        <div><h4>${T("sessionsH")}${state.day !== "all" ? " · " + dayLabel(state.day).replace(/<[^>]+>/g, "") : ""}</h4><div class="sessions-panel">${sess || `<p class="note">${T("noSessDay")}</p>`}</div></div>`;
      const tl = $("toLogin"); if (tl) tl.addEventListener("click", () => openAccount("login"));
      const keepDraft = () => { const t = $("revText"); if (t) draftText = t.value; };
      $("panelBody").querySelectorAll("[data-reply]").forEach(b => b.addEventListener("click", () => {
        keepDraft(); replyOpen = +b.dataset.reply || null; confirmKey = null; draw(); const t = $("replyText"); if (t) t.focus(); }));
      const rpf = $("panelBody").querySelector(".replyform");
      if (rpf) rpf.addEventListener("submit", async e => {
        e.preventDefault(); keepDraft(); const body = $("replyText").value.trim(); if (!body) return;
        const { error } = await sb.from("replies").insert({ review_id: +rpf.dataset.review, user_id: user.id, body });
        if (error) { await refreshProfile(); err = profile && profile.blocked ? "" : T("errGeneric"); msg = ""; replyOpen = profile && profile.blocked ? null : replyOpen; }
        else { replyOpen = null; err = ""; await loadReviews(); }
        draw();
      });
      $("panelBody").querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", async () => {   // second click confirms
        keepDraft(); const [type, id] = b.dataset.del.split(":"), k = "del-" + type + "-" + id;
        if (confirmKey !== k) { confirmKey = k; return draw(); }
        confirmKey = null;
        const { error } = await sb.from(type === "rev" ? "reviews" : "replies").delete().eq("id", +id);
        if (error) { err = T("errGeneric"); msg = ""; }
        else { if (type === "rev" && mine && mine.id === +id) { draftStars = 0; draftText = ""; } await loadReviews(); }
        draw();
      }));
      $("panelBody").querySelectorAll("[data-block]").forEach(b => b.addEventListener("click", async () => {
        keepDraft(); const uid = b.dataset.block, k = "blk-" + uid;
        if (confirmKey !== k) { confirmKey = k; return draw(); }
        confirmKey = null;
        const { error } = await sb.rpc("set_blocked", { target: uid, value: true });
        if (error) { err = T("errGeneric"); msg = ""; } else { msg = T("blockedOk"); err = ""; await loadReviews(); }
        draw();
      }));
      $("panelBody").querySelectorAll("[data-star]").forEach(b => b.addEventListener("click", () => {
        draftText = $("revText").value; const n = +b.dataset.star; draftStars = draftStars === n ? 0 : n; msg = err = ""; draw(); }));
      const rf = $("revForm");
      if (rf) rf.addEventListener("submit", async e => {
        e.preventDefault(); draftText = $("revText").value.trim();
        if (!draftStars && !draftText) { err = T("needStars"); msg = ""; return draw(); }
        const { error } = await sb.from("reviews").upsert({ user_id: user.id, film_key: key, film_title: f.t + (f.y ? " (" + f.y + ")" : ""),
          stars: draftStars || null, comment: draftText || null, updated_at: new Date().toISOString() }, { onConflict: "user_id,film_key" });
        if (error) { await refreshProfile(); err = profile && profile.blocked ? "" : T("errGeneric"); msg = ""; } else { msg = T("reviewSaved"); err = ""; await loadReviews(); }
        draw();
      });
      const del = $("revDel");
      if (del) del.addEventListener("click", async () => {
        const { error } = await sb.from("reviews").delete().eq("user_id", user.id).eq("film_key", key);
        if (!error) { draftStars = 0; draftText = ""; msg = ""; await loadReviews(); }
        draw();
      });
    } });
  }

  applyLang();
  render();
  initAuth();
})();
</script>
