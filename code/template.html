<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a ranked marquee list. Sticky filter bar, one row per film (rank, poster, details, ticket-stub rating), sessions grouped by cinema. Side panel for cinemas and discounts. */
:root {
  --bg: #f6f4f1;
  --surface: #ffffff;
  --ink: #1d1a1f;
  --muted: #6b6470;
  --line: #e3dfe2;
  --accent: #b02a37;
  --accent-ink: #ffffff;
  --vo: #8a5a00;
  --vo-bg: #fbefd2;
  --chip: #efecef;
  --past: #b7b1b9;
  --fav: #c98a00;
  --deal: #1f7a4d;
  --map-land: #efece7;
  --map-city: #e6e2dc;
  --map-line: #c9c3cb;
  --map-road: #e0a458;
  --map-water: #7fb0d6;
  --overlay: rgba(20, 16, 22, .35);
  --font-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151217; --surface: #1f1b22; --ink: #f1ecf2; --muted: #a59eaa; --line: #332d37;
    --accent: #f0646a; --accent-ink: #1a0b0d; --vo: #f2c46b; --vo-bg: #3a2f17; --chip: #2b262f; --past: #5d5662;
    --fav: #f2c46b; --deal: #5fd39a; --map-land: #1b181e; --map-city: #241f28; --map-line: #3d3642; --map-road: #a8743a; --map-water: #3d6f96;
    --overlay: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151217; --surface: #1f1b22; --ink: #f1ecf2; --muted: #a59eaa; --line: #332d37;
  --accent: #f0646a; --accent-ink: #1a0b0d; --vo: #f2c46b; --vo-bg: #3a2f17; --chip: #2b262f; --past: #5d5662;
  --fav: #f2c46b; --deal: #5fd39a; --map-land: #1b181e; --map-city: #241f28; --map-line: #3d3642; --map-road: #a8743a; --map-water: #3d6f96;
  --overlay: rgba(0, 0, 0, .55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }      /* panels, filter row: author display rules must not beat the hidden attribute */
html { -webkit-text-size-adjust: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
body.locked { overflow: hidden; }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { padding-block: 28px 8px; }
.brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.brand h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(40px, 8vw, 64px); line-height: .9; margin: 0; letter-spacing: .01em; text-transform: uppercase; }
.brand h1 span { color: var(--accent); }
.brand p { margin: 0; color: var(--muted); max-width: 46ch; text-wrap: balance; }
.stamp { color: var(--muted); font-size: 13px; margin-top: 10px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding-block: 12px; }
.bar .wrap { display: flex; flex-direction: column; gap: 10px; }
.days { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.days::-webkit-scrollbar { display: none; }
.pill { font-size: 14px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; white-space: nowrap; }
.pill small { color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }
.days .pill[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.days .pill[aria-pressed="true"] small { color: inherit; opacity: .7; }
.pill:disabled { opacity: .4; cursor: not-allowed; }
.row2 { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pill.vose[aria-pressed="true"] { background: var(--vo-bg); color: var(--vo); border-color: var(--vo); }
.pill.now[aria-pressed="true"], .pill.few[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pill.favs[aria-pressed="true"] { background: var(--fav); color: var(--bg); border-color: var(--fav); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 12px; font-size: 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.search { flex: 1 1 200px; min-width: 0; font: inherit; font-size: 14px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.tools { margin-left: auto; display: flex; gap: 8px; }
.count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.pill.filt[aria-expanded="true"], .pill.filt.on { border-color: var(--ink); }
.more-filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
.more-filters label { display: grid; gap: 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); min-width: 0; }
.more-filters select { font: inherit; font-size: 14px; text-transform: none; letter-spacing: 0; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; max-width: 46vw; }
.more-filters .pill { align-self: end; }
.badge { display: inline-block; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 2px; font-family: var(--font-body); font-weight: 600; }
.badge.split { color: var(--vo); }
.badge.classic { color: var(--muted); }
.badge.women { color: var(--deal); }
.badge.queer { color: var(--accent); }

.dist { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 4px; white-space: nowrap; }

main { padding-block: 8px 40px; }
.film { display: grid; grid-template-columns: 44px 72px minmax(0, 1fr) auto; gap: 4px 16px; padding-block: 20px; border-bottom: 1px solid var(--line); }
.rank { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.poster { width: 72px; aspect-ratio: 2 / 3; border-radius: 4px; background: var(--chip); object-fit: cover; max-width: 100%; }
.info { min-width: 0; }
.info h2 { font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 1.05; margin: 0 0 4px; text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
.info h2 a { color: inherit; text-decoration: none; }
.info h2 a:hover { color: var(--accent); }
.info h2 .yr { font-weight: 600; color: var(--muted); margin-left: 8px; font-variant-numeric: tabular-nums; }
.meta { color: var(--muted); font-size: 13.5px; }
.meta b { color: var(--ink); font-weight: 500; }
.others { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.others a { color: inherit; }
.stub { align-self: start; text-align: center; min-width: 78px; padding: 8px 10px 6px; border: 1.5px dashed var(--accent); border-radius: 6px; color: var(--accent); text-decoration: none; }
.stub .n { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.stub .n small { font-size: 16px; opacity: .7; }
.stub .v { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
.stub.none { border-color: var(--line); color: var(--muted); }
.stub.few .n { opacity: .55; }
.sessions { grid-column: 3 / 5; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.cine { display: grid; grid-template-columns: minmax(0, 230px) minmax(0, 1fr); gap: 4px 12px; align-items: baseline; }
.cname { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.star { border: 0; background: none; padding: 0 2px; cursor: pointer; color: var(--past); font-size: 15px; line-height: 1; }
.star[aria-pressed="true"] { color: var(--fav); }
.clink { border: 0; background: none; padding: 0; cursor: pointer; font-weight: 600; font-size: 14px; text-align: left; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.clink:hover { color: var(--accent); text-decoration-color: currentColor; }
.price { display: block; font-size: 12px; color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.price s { opacity: .7; }
.price .deal { color: var(--deal); font-weight: 600; }
.times { display: flex; flex-wrap: wrap; gap: 5px; }
.t { font-size: 13.5px; font-variant-numeric: tabular-nums; padding: 2px 8px; border-radius: 4px; background: var(--chip); }
.t.vo { background: var(--vo-bg); color: var(--vo); font-weight: 600; }
a.t { color: inherit; text-decoration: none; border: 1px solid transparent; }
a.t:hover { border-color: currentColor; }
a.t.vo { color: var(--vo); }
.t.vo::after { content: " VO"; font-size: 10px; letter-spacing: .05em; }
.t.past { color: var(--past); background: transparent; text-decoration: line-through; }
.t .d { color: var(--muted); font-size: 11px; margin-right: 4px; }
.more { font-size: 13px; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; justify-self: start; text-align: left; }
.empty { padding: 40px 0; color: var(--muted); text-align: center; }

section.fest { margin-top: 36px; }
.fest h3 { font-family: var(--font-display); font-weight: 800; font-size: 30px; text-transform: uppercase; margin: 0 0 4px; }
.fest > p { color: var(--muted); margin: 0 0 14px; max-width: 65ch; }
.ev { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 2px 14px; padding-block: 12px; border-top: 1px solid var(--line); }
.ev .when { font-variant-numeric: tabular-nums; font-weight: 600; }
.ev .when small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
.ev a { color: var(--ink); font-weight: 600; text-decoration: none; }
.ev a:hover { color: var(--accent); }
.tag { display: inline-block; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); }
.ev .desc { color: var(--muted); font-size: 13.5px; }

footer { color: var(--muted); font-size: 13px; padding-block: 20px 40px; border-top: 1px solid var(--line); }
footer p { max-width: 70ch; margin: 0 0 8px; }
footer a { color: inherit; }

/* side panel */
.scrim { position: fixed; inset: 0; background: var(--overlay); z-index: 20; }
.panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--bg); z-index: 21; border-left: 1px solid var(--line);
  display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.panel-head { display: flex; align-items: flex-start; gap: 10px; padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
.panel-head h3 { font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1; margin: 0; text-transform: uppercase; flex: 1; min-width: 0; text-wrap: balance; }
.panel-head .sub { font-size: 13px; color: var(--muted); margin-top: 4px; font-family: var(--font-body); text-transform: none; font-weight: 400; }
.close { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; width: 34px; height: 34px; cursor: pointer; flex: none; font-size: 18px; line-height: 1; }
.panel-body { overflow-y: auto; padding: 16px 20px 28px; display: flex; flex-direction: column; gap: 18px; }
.panel h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.mapbox { position: relative; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--map-land); }
.mapbox svg { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; }
.mapbox .zoom { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 4px; }
.mapbox .zoom button { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 16px; }
.maplinks { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13.5px; margin-top: 8px; }
.maplinks a { color: var(--accent); }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; }
.kv .deal { color: var(--deal); font-weight: 600; }
.plist { display: flex; flex-direction: column; }
.pfilm { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 2px 12px; padding-block: 10px; border-top: 1px solid var(--line); align-items: start; }
.pfilm img, .pfilm .ph { width: 40px; aspect-ratio: 2 / 3; border-radius: 3px; object-fit: cover; background: var(--chip); }
.pfilm b { font-weight: 600; }
.pfilm .sc { font-family: var(--font-display); font-weight: 800; font-size: 22px; color: var(--accent); font-variant-numeric: tabular-nums; }
.pfilm .times { margin-top: 4px; }
.dir { display: flex; flex-direction: column; }
.dir .row { display: flex; align-items: center; gap: 8px; padding-block: 8px; border-top: 1px solid var(--line); }
.dir .row .clink { flex: 1; min-width: 0; }
.dir .row small { color: var(--muted); font-size: 12px; white-space: nowrap; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 14px; }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.form { display: grid; gap: 10px; }
.form label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.form input, .form select { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; width: 100%; }
.form .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.wd { display: flex; gap: 4px; flex-wrap: wrap; }
.wd label { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; color: var(--ink); background: var(--surface); cursor: pointer; }
.wd input { width: auto; margin: 0; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.quick button { font-size: 13px; border: 1px dashed var(--line); background: none; border-radius: 999px; padding: 4px 10px; cursor: pointer; }
.disc { display: flex; justify-content: space-between; gap: 10px; padding-block: 10px; border-top: 1px solid var(--line); font-size: 14px; }
.disc small { display: block; color: var(--muted); }
.disc button { border: 0; background: none; color: var(--accent); cursor: pointer; font-size: 13px; }
.note { font-size: 13px; color: var(--muted); }
.err { font-size: 13px; color: var(--accent); }

@media (max-width: 640px) {
  .film { grid-template-columns: 64px minmax(0, 1fr) auto; gap: 4px 12px; }
  .rank { display: none; }
  .poster { width: 64px; }
  .info h2 { font-size: 22px; }
  .sessions { grid-column: 1 / 4; }
  .cine { grid-template-columns: minmax(0, 1fr); }
  .stub { min-width: 64px; padding: 6px 8px 4px; }
  .stub .n { font-size: 28px; }
  .tools { margin-left: 0; }
  .panel { top: auto; height: 88%; width: 100%; border-left: 0; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; padding-left: env(safe-area-inset-left, 0px); }
}
@media (prefers-reduced-motion: no-preference) {
  .film { animation: rise .25s ease-out both; }
  .panel { animation: slide .2s ease-out both; }
  @keyframes rise { from { transform: translateY(4px); } to { transform: none; } }
  @keyframes slide { from { transform: translateX(16px); } to { transform: none; } }
}

.lang { display: inline-flex; gap: 2px; margin-left: auto; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.lang button { border: 0; background: none; padding: 4px 10px; font-size: 12px; letter-spacing: .06em; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.pill.tog[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tracked { margin-top: 14px; padding: 10px 14px; border: 1px solid var(--fav); border-radius: 8px; font-size: 14px; background: var(--surface); }
.tlink { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.follow { margin-top: 6px; font-size: 12.5px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 10px; cursor: pointer; }
.follow[aria-pressed="true"] { border-color: var(--fav); color: var(--fav); font-weight: 600; }
.film.is-tracked .poster { outline: 2px solid var(--fav); outline-offset: 2px; }
.badge.new { color: var(--deal); }
.badge.last { color: var(--accent); }
.badge.wl { color: var(--fav); }
.muted { color: var(--muted); }
.calrow { border-top: 1px solid var(--line); padding-block: 10px; }
.calrow summary { cursor: pointer; display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 2px 14px; list-style: none; }
.calrow summary::-webkit-details-marker { display: none; }
.calrow .cdates { font-weight: 600; font-variant-numeric: tabular-nums; }
.calrow .cname2 { font-weight: 600; }
.calrow .meta { grid-column: 2; }
.calrow ul { margin: 8px 0 0 154px; padding: 0; list-style: none; font-size: 14px; display: grid; gap: 4px; }
.calrow .when2 { font-variant-numeric: tabular-nums; color: var(--muted); }
.calrow a { color: var(--ink); }
.addt { grid-template-columns: minmax(0, 1fr) auto; align-items: end; margin-top: 10px; }
.filebtn { display: inline-block; cursor: pointer; }
.cinehits { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
@media (max-width: 640px) {
  .calrow summary { grid-template-columns: minmax(0, 1fr); }
  .calrow .meta { grid-column: 1; }
  .calrow ul { margin-left: 0; }
  .lang { margin-left: 0; }
}
</style>

<header class="top wrap">
  <div class="brand">
    <h1>Vamos al cine<span>.</span></h1>
    <p data-i18n="tagline"></p>
    <div class="lang" role="group" aria-label="Idioma / Language"><button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="fr">FR</button></div>
  </div>
  <div class="stamp" id="stamp"></div>
</header>

<div class="bar">
  <div class="wrap">
    <div class="days" id="days" role="group"></div>
    <div class="row2">
      <span class="seg-label" data-i18n="score"></span>
      <div class="seg" id="src" role="group">
        <button type="button" data-s="fa">Filmaffinity</button><button type="button" data-s="im">IMDb</button><button type="button" data-s="lb">Letterboxd</button><button type="button" data-s="av" data-i18n="avg"></button>
      </div>
      <div class="tools">
        <button class="pill" id="openDir" type="button" data-i18n="cinemas"></button>
        <button class="pill" id="openTrack" type="button"></button>
        <button class="pill" id="openDisc" type="button"></button>
      </div>
    </div>
    <div class="row2">
      <button class="pill now" id="now" type="button" aria-pressed="false" data-i18n="soon"></button>
      <button class="pill vose" id="vose" type="button" aria-pressed="false" data-i18n="voseOnly"></button>
      <button class="pill favs" id="favs" type="button" aria-pressed="false"></button>
      <button class="pill few" id="few" type="button" aria-pressed="true" data-i18n="votes100"></button>
      <button class="pill filt" id="filt" type="button" aria-expanded="false" aria-controls="moreFilters"></button>
      <input class="search" id="q" type="search" list="titles" autocomplete="off">
      <datalist id="titles"></datalist>
      <span class="count" id="count"></span>
    </div>
    <div class="more-filters" id="moreFilters" hidden>
      <label><span data-i18n="genre"></span><select id="fGenre"><option value="" data-i18n="all"></option></select></label>
      <label><span data-i18n="length"></span><select id="fDur"><option value="0" data-i18n="any"></option><option value="100">≤ 1 h 40</option><option value="120">≤ 2 h</option><option value="150">≤ 2 h 30</option></select></label>
      <label><span data-i18n="country"></span><select id="fCountry"><option value="" data-i18n="all"></option></select></label>

    fr: { Drama: "Drame", Comedy: "Comédie", Documentary: "Documentaire", Animation: "Animation", Horror: "Horreur", Thriller: "Thriller", Romance: "Romance", Action: "Action", Adventure: "Aventure", Crime: "Policier", Family: "Famille", Fantasy: "Fantastique", "Sci-Fi": "Science-fiction", Mystery: "Mystère", History: "Histoire", Biography: "Biopic", Music: "Musique", Musical: "Comédie musicale", War: "Guerre", Western: "Western", Sport: "Sport", Short: "Court métrage" },
    en: {},
  };
  let lang = "es";
  try { const sl = localStorage.getItem("vamosalcine.lang"); if (L[sl]) lang = sl; else if (/^en/i.test(navigator.language)) lang = "en"; else if (/^fr/i.test(navigator.language)) lang = "fr"; } catch (e) {}
  const T = k => L[lang][k];
  const WD = () => WDS[lang], WDL = () => WDLS[lang];

  const pad = n => String(n).padStart(2, "0");
  const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  const eur = p => p === 0 ? T("free") : p.toFixed(2).replace(".", lang === "en" ? "." : ",") + " €";
  const num = (x, d) => x.toFixed(d).replace(".", lang === "en" ? "." : ",");
  const MIN_VOTES = 100;
  const LAT0 = 40.4168, LON0 = -3.7038, KX = Math.cos(LAT0 * Math.PI / 180) * 111.32, KY = 110.54;
  const proj = (lat, lon) => [(lon - LON0) * KX, -(lat - LAT0) * KY];
  const km = (a, b) => Math.hypot((a.lon - b.lon) * KX, (a.lat - b.lat) * KY);
  const $ = id => document.getElementById(id);
  // search: every typed word must start a word of the title, director or cinema ("dore" finds Doré, not Embajadores)
  const hits = (text, q) => { if (!q) return true; const w = norm(text).split(" "); return q.split(" ").every(t => w.some(x => x.startsWith(t))); };

  const now = new Date(), todayIso = iso(now), nowMin = now.getHours() * 60 + now.getMinutes();
  const toMin = t => { const m = +t.slice(0, 2) * 60 + +t.slice(3); return m < 300 ? m + 1440 : m; };   // after-midnight sessions count as late
  const isPast = s => s[2] === todayIso && toMin(s[3]) < nowMin - 10;
  D.shows = D.shows.filter(s => s[2] >= todayIso);                // the data file can be a day old
  const dates = [...new Set(D.shows.map(s => s[2]).concat(D.events.map(e => e.date).filter(d => d >= todayIso)))].sort();

  // films: all titles a person might type, last screening date
  const lastDate = {};
  D.shows.forEach(s => { if (!lastDate[s[0]] || s[2] > lastDate[s[0]]) lastDate[s[0]] = s[2]; });
  D.films.forEach((f, i) => { f.keys = [...new Set([f.t, f.en, f.orig].filter(Boolean).map(norm))]; f.idx = i; });
  D.shows.forEach(s => { if (s[6] && /queer|lgtb|lgbt|orgullo|pride/i.test(s[6])) D.films[s[0]].qu = 1; });
  const daysSince = d => Math.round((parse(todayIso) - parse(d)) / 864e5);
  const isNew = f => f.fs && daysSince(f.fs) <= 7;
  const isLast = f => D.full_week && lastDate[f.idx] && Math.round((parse(lastDate[f.idx]) - parse(todayIso)) / 864e5) <= 1;

  // Doré / Berlanga / Casa Encendida festival sessions join today's festival list
  const FEST_RE = /festival|queercinemad|muestra|semana de|m.rgenes|documenta|animadrid|cine por mujeres/i;
  // one calendar row per festival, whatever each venue calls it
  const FEST_NAMES = [[/cine por mujeres/i, "Cine por Mujeres Madrid"], [/queercinemad/i, "QueerCineMad"], [/m.rgenes/i, "Festival Márgenes"],
    [/mi primer festival/i, "Mi Primer Festival"], [/documenta/i, "Documenta Madrid"], [/animadrid/i, "Animadrid"]];
  D.shows.forEach(s => {
    if (s[6] && FEST_RE.test(s[6])) {
      const f = D.films[s[0]];
      D.events.push({ date: s[2], times: [s[3]], t: f.t + (f.y ? " (" + f.y + ")" : ""), u: f.u, rt: f.rt, sec: "", cyc: s[6], desc: f.d ? f.d : "", w: D.cinemas[s[1]].n });
    }
  });
  D.events.sort((a, b) => (a.date + a.times[0]).localeCompare(b.date + b.times[0]));

  const spreadOf = f => { const xs = [f.r, f.ir, f.lr != null ? f.lr * 2 : null].filter(x => x != null); return xs.length >= 2 ? Math.max(...xs) - Math.min(...xs) : 0; };
  const SRC = {
    fa: { name: "Filmaffinity", get: f => ({ r: f.r, v: f.v || 0, max: 10, url: f.u }) },
    im: { name: "IMDb", get: f => ({ r: f.ir, v: f.iv || 0, max: 10, url: f.imdb ? "https://www.imdb.com/title/" + f.imdb + "/" : "" }) },
    lb: { name: "Letterboxd", get: f => ({ r: f.lr, v: f.lv || 0, max: 5, url: f.lu }) },
    av: { name: "", get: f => {
      const xs = [f.r, f.ir, f.lr != null ? f.lr * 2 : null].filter(x => x != null);
      return { r: xs.length >= 2 ? xs.reduce((a, b) => a + b, 0) / xs.length : null, v: (f.v || 0) + (f.iv || 0) + (f.lv || 0), max: 10, url: "" };
    } },
  };
  const srcName = k => k === "av" ? T("avg") : SRC[k].name;

  // ---------- per-viewer state (this browser only) ----------
  const KEY = "vamosalcine.v1";
  const state = { day: dates.includes(todayIso) ? todayIso : dates[0], now: false, vose: false, few: true, favOnly: false, src: "fa", q: "",
    open: new Set(), favs: new Set(), discounts: [], track: [], wl: [], topic: "",
    genre: "", dur: 0, country: "", from: "", until: "", near: "", radius: 2,
    classic: false, women: false, queer: false, onlyTracked: false, onlyWatch: false, onlyNew: false, filtOpen: false };
  const faMissing = D.films.filter(f => f.r != null).length < D.films.length * .3;   // Filmaffinity blocked or stale today
  if (faMissing) state.src = "av";
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || "{}");
    ["vose", "few", "favOnly"].forEach(k => { if (typeof s[k] === "boolean") state[k] = s[k]; });
    if (SRC[s.src] && !(faMissing && s.src === "fa")) state.src = s.src;
    if (Array.isArray(s.favs)) state.favs = new Set(s.favs);
    ["discounts", "track", "wl"].forEach(k => { if (Array.isArray(s[k])) state[k] = s[k]; });
    if (typeof s.near === "string") state.near = s.near;
    if (typeof s.radius === "number") state.radius = s.radius;
    if (typeof s.topic === "string") state.topic = s.topic;
  } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ vose: state.vose, few: state.few, favOnly: state.favOnly, src: state.src,
    favs: [...state.favs], discounts: state.discounts, track: state.track, wl: state.wl, near: state.near, radius: state.radius, topic: state.topic })); } catch (e) {} };

  const isFav = c => state.favs.has(D.cinemas[c].n);
  function toggleFav(c) { const n = D.cinemas[c].n; state.favs.has(n) ? state.favs.delete(n) : state.favs.add(n); if (!state.favs.size) state.favOnly = false; save(); render(); refreshPanel(); }

  // tracked films and watchlist: matched by any title (Spanish, English, original) and, for the watchlist, year ± 1
  const trackKeys = () => new Set(state.track.map(t => norm(t)));
  const isTracked = f => { const k = trackKeys(); return f.keys.some(x => k.has(x)); };
  function toggleTrack(f) {
    if (isTracked(f)) state.track = state.track.filter(t => !f.keys.includes(norm(t)));
    else state.track.push(f.t);
    save(); render(); refreshPanel();
  }
  const inWatchlist = f => state.wl.some(w => f.keys.includes(norm(w.n)) && (!w.y || !f.y || Math.abs(w.y - f.y) <= 1));

  // ---------- prices ----------
  const scopeMatches = (d, c) => { const C = D.cinemas[c]; return d.scope === "all" || d.scope === "chain:" + C.ch || d.scope === "cinema:" + C.n; };
  function priceFor(c, date, sessionPrice) {
    const base = sessionPrice ?? D.cinemas[c].p ?? null;
    const dow = parse(date).getDay();
    let best = null;
    for (const d of state.discounts) {
      if (!scopeMatches(d, c) || (d.days && d.days.length && !d.days.includes(dow))) continue;
      let p = null;
      if (d.kind === "price") p = d.value;
      else if (base != null && d.kind === "pct") p = base * (1 - d.value / 100);
      else if (base != null && d.kind === "off") p = Math.max(0, base - d.value);
      if (p != null && (base == null || p < base) && (!best || p < best.p)) best = { p, name: d.name };
    }
    return { base, best };
  }
  function priceHtml(c, list) {
    const ps = list.map(s => priceFor(c, s[2], s[5]));
    const bases = ps.map(x => x.base).filter(x => x != null);
    const deals = ps.filter(x => x.best);
    const lo = bases.length ? Math.min(...bases) : null, hi = bases.length ? Math.max(...bases) : null;
    const baseTxt = lo == null ? "" : (lo === hi ? eur(lo) : eur(lo) + "–" + eur(hi));
    if (deals.length) {
      const d = deals.reduce((a, b) => a.best.p <= b.best.p ? a : b).best;
      return `<span class="price">${baseTxt ? "<s>" + baseTxt + "</s> " : ""}<span class="deal">${eur(d.p)}</span> ${T("withDisc")} ${esc(d.name)}</span>`;
    }
    return baseTxt ? `<span class="price">${lo === 0 ? "" : T("from_") + " "}${baseTxt}</span>` : "";
  }

  // ---------- filters ----------
  const fillSelect = (el, items) => { el.querySelectorAll("option:not(:first-child)").forEach(o => o.remove()); el.insertAdjacentHTML("beforeend", items.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join("")); };
  const hours = []; for (let h = 10; h <= 24; h++) hours.push([pad(h % 24) + ":00", pad(h % 24) + ":00"]);
  const metroOf = name => { const m = METRO.find(x => x[0] === name); return m ? { lat: m[1], lon: m[2] } : null; };
  const distTo = c => { const st = metroOf(state.near), C = D.cinemas[c]; return st && C.lat != null ? km(C, st) : null; };
  function fillFilterOptions() {
    const g = $("fGenre").value || state.genre;
    fillSelect($("fGenre"), [...new Set(D.films.flatMap(f => f.g || []))].map(x => [x, GENRES[lang][x] || x]).sort((a, b) => a[1].localeCompare(b[1], lang)));
    $("fGenre").value = g;
    fillSelect($("fCountry"), [...new Set(D.films.map(f => f.c).filter(Boolean))].sort((a, b) => a.localeCompare(b, "es")).map(c => [c, c]));
    fillSelect($("fFrom"), hours.slice(0, -1)); fillSelect($("fUntil"), hours.slice(2));
    if (METRO.length) fillSelect($("fNear"), METRO.map(m => [m[0], m[0]])); else $("nearWrap").hidden = true;
    [["fGenre", "genre"], ["fCountry", "country"], ["fFrom", "from"], ["fUntil", "until"], ["fNear", "near"]].forEach(([id, k]) => { $(id).value = state[k]; });
    $("fDur").value = String(state.dur); $("fRadius").value = String(state.radius);
    $("titles").innerHTML = [...new Set(D.films.flatMap(f => [f.t, f.en].filter(Boolean)).concat(D.cinemas.map(c => c.n)))].sort((a, b) => a.localeCompare(b, "es")).map(t => `<option value="${esc(t)}">`).join("");
  }
  [["fGenre", "genre"], ["fCountry", "country"], ["fFrom", "from"], ["fUntil", "until"], ["fNear", "near"]].forEach(([id, k]) => {
    $(id).addEventListener("change", e => { state[k] = e.target.value; save(); render(); });
  });
  $("fDur").addEventListener("change", e => { state.dur = +e.target.value; render(); });
  $("fRadius").addEventListener("change", e => { state.radius = +e.target.value; save(); render(); });
  const TOGGLES = [["fClassic", "classic"], ["fWomen", "women"], ["fQueer", "queer"], ["fTracked", "onlyTracked"], ["fWatch", "onlyWatch"], ["fNew", "onlyNew"]];
  TOGGLES.forEach(([id, k]) => $(id).addEventListener("click", () => { state[k] = !state[k]; render(); }));
  $("filt").addEventListener("click", () => { state.filtOpen = !state.filtOpen; $("moreFilters").hidden = !state.filtOpen; $("filt").setAttribute("aria-expanded", state.filtOpen); });
  $("fReset").addEventListener("click", () => {
    Object.assign(state, { genre: "", dur: 0, country: "", from: "", until: "", near: "", classic: false, women: false, queer: false, onlyTracked: false, onlyWatch: false, onlyNew: false });
    save(); fillFilterOptions(); render();
  });
  const activeFilters = () => [state.genre, state.dur, state.country, state.from, state.until, state.near, ...TOGGLES.map(([, k]) => state[k])].filter(Boolean).length;
  const filmOk = f => (!state.genre || (f.g || []).includes(state.genre)) && (!state.dur || (f.rt && f.rt <= state.dur)) &&
    (!state.country || f.c === state.country) && (!state.classic || (f.y && f.y < 2000)) && (!state.women || f.wo) && (!state.queer || f.qu) &&
    (!state.onlyTracked || isTracked(f)) && (!state.onlyWatch || inWatchlist(f)) && (!state.onlyNew || isNew(f));

  // ---------- header controls ----------
  const daysEl = $("days");
  function dayLabel(d) {
    if (d === "all") return T("week");
    const dt = parse(d), diff = Math.round((dt - parse(todayIso)) / 864e5);
    return (diff === 0 ? T("today") : diff === 1 ? T("tomorrow") : WDL()[dt.getDay()]) + " <small>" + dt.getDate() + "</small>";
  }
  daysEl.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; state.day = b.dataset.d; if (state.day !== todayIso) state.now = false; render(); refreshPanel(); });
  $("now").addEventListener("click", () => { if (!dates.includes(todayIso)) return; state.now = !state.now; if (state.now) state.day = todayIso; render(); });
  $("vose").addEventListener("click", () => { state.vose = !state.vose; save(); render(); refreshPanel(); });
  $("few").addEventListener("click", () => { state.few = !state.few; save(); render(); });
  $("favs").addEventListener("click", () => { if (!state.favs.size) { openDirectory(); return; } state.favOnly = !state.favOnly; save(); render(); });
  $("src").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; state.src = b.dataset.s; save(); render(); refreshPanel(); });
  $("q").addEventListener("input", e => { state.q = norm(e.target.value); render(); });
  $("openDir").addEventListener("click", () => openDirectory());
  $("openDisc").addEventListener("click", () => openDiscounts());
  $("openTrack").addEventListener("click", () => openTracking());
  document.querySelector(".lang").addEventListener("click", e => {
    const b = e.target.closest("[data-lang]"); if (!b) return;
    lang = b.dataset.lang; try { localStorage.setItem("vamosalcine.lang", lang); } catch (err) {}
    applyLang(); render(); refreshPanel();
  });
  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => { const v = T(el.dataset.i18n); if (typeof v === "string") el.textContent = v; });
    document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
    $("q").placeholder = T("search"); $("q").setAttribute("aria-label", T("search"));
    $("close").setAttribute("aria-label", T("close"));
    const sc = new Date(D.scraped);
    const st = WDL()[sc.getDay()].toLowerCase() + " " + sc.getDate() + "/" + (sc.getMonth() + 1) + " " + T("at") + " " + pad(sc.getHours()) + ":" + pad(sc.getMinutes());
    $("stamp").textContent = T("updated")(st, D.films.length, D.cinemas.length);
    $("stamp2").textContent = st;
    if (!dates.includes(todayIso)) { $("now").disabled = true; }
    fillFilterOptions();
  }

  function stubHtml(f, small) {
    const R = SRC[state.src].get(f);
    if (R.r == null) return small ? `<span class="sc muted">–</span>` : `<div class="stub none" title="${esc(T("noScore"))}"><div class="n">–</div><div class="v">${T("noScore")}</div></div>`;
    const val = R.max === 5 ? num(R.r, 2) : num(R.r, 1);
    if (small) return `<span class="sc">${val}</span>`;
    const tag = R.url ? "a" : "div";
    return `<${tag} class="stub${R.v < MIN_VOTES ? " few" : ""}"${R.url ? ` href="${esc(R.url)}" target="_blank" rel="noopener"` : ""} title="${esc(T("scoreOf")(srcName(state.src)))}">
      <div class="n">${val}${R.max === 5 ? "<small>/5</small>" : ""}</div><div class="v">${R.v.toLocaleString(lang)} ${T("votes")}</div></${tag}>`;
  }
  const sortFilms = (a, b) => { const A = SRC[state.src].get(a), B = SRC[state.src].get(b); return (B.r ?? -1) / B.max - (A.r ?? -1) / A.max || B.v - A.v; };
  // each time links to that session's ticket page, or to the cinema's own listing when the source gives no link
  const chipsHtml = (list, multi) => list.map(s => {
    const url = s[7] || D.cinemas[s[1]].u, tip = T("buy") + (s[5] != null ? " · " + eur(s[5]) : "");
    return `<a class="t${s[4] ? " vo" : ""}${isPast(s) ? " past" : ""}" href="${esc(url)}" target="_blank" rel="noopener" title="${esc(tip)}">${multi ? `<span class="d">${WD()[parse(s[2]).getDay()]}</span>` : ""}${s[3]}</a>`;
  }).join("");
  const filteredShows = extra => D.shows.filter(s => (state.day === "all" || s[2] === state.day) && (!state.vose || s[4]) && (!extra || extra(s)));
  const badges = f => (f.y && f.y < 2000 ? `<span class="badge classic">${T("classic")}</span>` : "") +
    (isNew(f) ? `<span class="badge new">${T("isNew")}</span>` : "") + (isLast(f) ? `<span class="badge last">${T("lastDays")}</span>` : "") +
    (f.wo ? `<span class="badge women">${T("director")}</span>` : "") + (f.qu ? `<span class="badge queer">LGTBIQ+</span>` : "") +
    (inWatchlist(f) ? `<span class="badge wl">${T("watch")}</span>` : "") +
    (spreadOf(f) >= 1.5 ? `<span class="badge split" title="${esc(T("splitT")(num(spreadOf(f), 1)))}">${T("split")}</span>` : "");

  // ---------- main list ----------
  function render() {
    daysEl.innerHTML = dates.concat(["all"]).map(d => `<button type="button" class="pill" data-d="${d}" aria-pressed="${state.day === d}">${dayLabel(d)}</button>`).join("");
    $("now").setAttribute("aria-pressed", state.now); $("vose").setAttribute("aria-pressed", state.vose); $("few").setAttribute("aria-pressed", state.few);
    $("favs").setAttribute("aria-pressed", state.favOnly);
    $("favs").textContent = T("myCinemas") + (state.favs.size ? " (" + state.favs.size + ")" : "");
    $("openDisc").textContent = T("myDisc") + (state.discounts.length ? " (" + state.discounts.length + ")" : "");
    $("openTrack").textContent = T("myFilms") + (state.track.length ? " (" + state.track.length + ")" : "");
    const nf = activeFilters();
    $("filt").textContent = T("filters") + (nf ? " (" + nf + ")" : ""); $("filt").classList.toggle("on", nf > 0);
    TOGGLES.forEach(([id, k]) => $(id).setAttribute("aria-pressed", state[k]));
    $("fWatch").hidden = !state.wl.length; $("fTracked").hidden = !state.track.length; $("fNew").hidden = !D.films.some(isNew);
    [...$("src").children].forEach(b => b.setAttribute("aria-pressed", b.dataset.s === state.src));
    const q = state.q;
    const byFilm = new Map();
    for (const s of filteredShows(s => {
      if (state.favOnly && !isFav(s[1])) return false;
      if (state.now) { const m = toMin(s[3]); if (s[2] !== todayIso || m < nowMin - 5 || m > nowMin + 180) return false; }
      if (state.from && toMin(s[3]) < toMin(state.from)) return false;
      if (state.until && toMin(s[3]) + (D.films[s[0]].rt || 110) > toMin(state.until)) return false;   // runtime unknown: assume 110 min
      if (state.near) { const d = distTo(s[1]); if (d == null || d > state.radius) return false; }
      const f = D.films[s[0]];
      if (!filmOk(f)) return false;
      if (q && !(f.keys.some(k => hits(k, q)) || hits(f.d, q) || hits(D.cinemas[s[1]].n, q))) return false;
      return true;
    })) {
      if (!byFilm.has(s[0])) byFilm.set(s[0], []);
      byFilm.get(s[0]).push(s);
    }
    let films = [...byFilm.keys()].map(i => D.films[i]);
    if (state.few && !q) films = films.filter(f => SRC[state.src].get(f).v >= MIN_VOTES || isTracked(f) || inWatchlist(f));
    films.sort(sortFilms);
    $("count").textContent = T("films")(films.length);

    // films you follow / watchlist that are on (any day)
    const onNow = D.films.filter(f => lastDate[f.idx] && (isTracked(f) || inWatchlist(f)));
    $("tracked").hidden = !onNow.length;
    if (onNow.length) {
      $("tracked").innerHTML = `<b>${T("trackedNow")}</b> ` + onNow.map(f => {
        const n = new Set(D.shows.filter(s => s[0] === f.idx).map(s => s[1])).size;
        return `<button class="tlink" type="button" data-find="${esc(f.t)}">${esc(f.t)}</button> <span class="meta">(${T("inCinemas")(n)})</span>`;
      }).join(" · ");
    }

    const multi = state.day === "all";
    const rawQ = $("q").value.trim();
    const cineHits = q ? D.cinemas.map((c, i) => [c, i]).filter(([c]) => hits(c.n, q)) : [];
    const offerTrack = rawQ.length >= 3 && !cineHits.length && !D.films.some(f => f.keys.some(k => hits(k, q))) && !state.track.some(t => norm(t) === q);
    $("list").innerHTML = (cineHits.length ? `<div class="cinehits">${cineHits.slice(0, 6).map(([c, i]) => `<button class="pill" type="button" data-cine="${i}">${esc(c.n)} →</button>`).join("")}</div>` : "") +

  // ---------- my films: tracking, Letterboxd watchlist, phone alerts ----------
  function parseCsv(text) {
    const rows = []; let row = [], cell = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) { if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (ch === '"') q = false; else cell += ch; }
      else if (ch === '"') q = true; else if (ch === ",") { row.push(cell); cell = ""; }
      else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
      else cell += ch;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }
  const readText = file => new Promise((ok, fail) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = fail; r.readAsText(file); });
  async function readWatchlist(file) {
    let text = null;
    if (/\.zip$/i.test(file.name)) {
      if (!window.JSZip) throw new Error("zip");
      const zip = await JSZip.loadAsync(file);
      const entry = Object.values(zip.files).find(z => /(^|\/)watchlist\.csv$/i.test(z.name));
      if (entry) text = await entry.async("string");
    } else text = await readText(file);
    if (!text) throw new Error("csv");
    const rows = parseCsv(text.replace(/^﻿/, ""));
    const head = (rows.shift() || []).map(h => h.trim().toLowerCase());
    const iN = head.indexOf("name"), iY = head.indexOf("year");
    if (iN < 0) throw new Error("csv");
    return rows.filter(r => r[iN]).map(r => ({ n: r[iN], y: +r[iY] || null }));
  }
  const newTopic = () => "vamosalcine-" + Array.from(crypto.getRandomValues(new Uint8Array(6)), b => "abcdefghijkmnpqrstuvwxyz23456789"[b % 32]).join("");
  function copyBtn(id, text) {
    const b = $(id); if (!b) return;
    b.addEventListener("click", () => {
      const done = () => { b.textContent = T("copied"); setTimeout(() => { b.textContent = T("copy"); }, 1500); };
      const fallback = () => { const ta = b.parentElement.querySelector("textarea, code"); if (!ta) return; const r = document.createRange(); r.selectNodeContents(ta); const s = getSelection(); s.removeAllRanges(); s.addRange(r); if (ta.select) ta.select(); };
      try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
    });
  }

      $("panelTitle").innerHTML = `${T("trackTitle")}<div class="sub">${T("trackSub")}</div>`;
      $("panelBody").innerHTML = `
        <div><h4>${T("tracking")}</h4>${state.track.length ? state.track.map((t, i) => {
          const f = showing(t);
          const n = f ? new Set(D.shows.filter(s => s[0] === f.idx).map(s => s[1])).size : 0;
          return `<div class="disc"><div><b>${esc(t)}</b><small>${f ? `<button class="tlink" type="button" data-find="${esc(f.t)}">${esc(T("onNow")(T("inCinemas")(n)))}</button>` : T("notYet")}</small></div><button type="button" data-untrack="${i}">${T("remove")}</button></div>`;
        }).join("") : `<p class="note">${T("trackNone")}</p>`}
          <form class="form addt" id="trackForm" novalidate><label>${T("addTitle")}<input id="tName" list="titles" placeholder="${esc(T("addTitlePh"))}"></label><button class="btn" type="submit">${T("add")}</button></form></div>
        <div><h4>${T("wlTitle")}</h4><p class="note">${T("wlHelp")}</p>
          <label class="btn ghost filebtn">${T("wlFile")}<input type="file" id="wlFile" accept=".zip,.csv" hidden></label>
          ${state.wl.length ? `<p class="note">${esc(T("wlLoaded")(state.wl.length, wlOn))} <button class="more" type="button" id="wlClear">${T("wlClear")}</button></p>` : ""}
          <p class="err" id="wlErr" hidden></p></div>
        <p class="note">${T("emailSoon")}</p>`;
      $("panelBody").querySelectorAll("[data-untrack]").forEach(b => b.addEventListener("click", () => { state.track.splice(+b.dataset.untrack, 1); save(); render(); draw(); }));
      $("trackForm").addEventListener("submit", e => { e.preventDefault(); const t = $("tName").value.trim(); if (t && !state.track.some(x => norm(x) === norm(t))) { state.track.push(t); save(); render(); } draw(); });
      $("wlFile").addEventListener("change", async e => {
        const file = e.target.files[0]; if (!file) return;
        try { state.wl = await readWatchlist(file); save(); render(); draw(); }
        catch (err) { $("wlErr").textContent = T("wlErr"); $("wlErr").hidden = false; }
      });
      const wc = $("wlClear"); if (wc) wc.addEventListener("click", () => { state.wl = []; save(); render(); draw(); });
    } });
  }

  applyLang();
  render();
})();
</script>
